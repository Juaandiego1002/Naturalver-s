version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: naturalvers-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: naturalvers
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/naturalvers --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data: